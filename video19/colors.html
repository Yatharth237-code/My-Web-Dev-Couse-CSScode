<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        #a {
            color: red;
        }

        #b {
            color: #00ff00;
        }

        #c {
            color: rgb(0, 0, 255);
        }

        #d {
            color: rgba(255, 0, 0, 0.5);
        }

        #e {
            color: hsl(120, 100%, 50%);
        }
    </style>
</head>
<body>
    <h1>Lets learn about colors.</h1>
    <p>
        Colors can be represted as:
        <ul>
            <li id="a">Color keyword</li>
            <li id="b">Hex color code</li>
            <li id="c">RGB</li>
            <li id="d">RGBA</li>
            <li id="e">HSL</li>
        </ul>
    </p>
</body>
</html>
